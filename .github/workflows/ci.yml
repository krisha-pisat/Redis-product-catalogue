name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check backend

  build-and-smoke-test:
    name: Build images and smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      # No Supabase secrets in CI, so only the backend, Redis and the
      # frontend are checked; the database is expected to be "disconnected".
      - name: Start the stack
        run: docker compose up -d --wait

      - name: Backend is up and connected to Redis
        run: |
          health=$(curl -sf http://localhost:8000/api/health)
          echo "$health"
          echo "$health" | grep -q '"backend":"ok"'
          echo "$health" | grep -q '"redis":"connected"'

      - name: Frontend is served
        run: curl -sf http://localhost:5500/ | grep -q "<html"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down
